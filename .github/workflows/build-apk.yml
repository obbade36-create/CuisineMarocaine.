```yaml
name: Build APK Cuisine Marocaine

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compiler APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Donner les permissions à Gradle
        run: chmod +x gradlew

      - name: Compiler APK Debug
        run: ./gradlew assembleDebug

      - name: Renommer APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/CuisineMarocaine.apk

      - name: Publier APK comme Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cuisine-Marocaine-APK
          path: release/CuisineMarocaine.apk
          retention-days: 30
```
